<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생명과학Ⅰ OX 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1EEFA;
    --paper: #FFFFFF;
    --paper-light: #F6F4FC;
    --paper-line: #E7E3F5;
    --ink: #2E2B45;
    --pencil: #8B87A6;
    --pen-blue: #4A90D9;
    --pen-blue-dark: #2F6BB0;
    --pen-red: #E8536B;
    --pen-red-dark: #C23652;
    --highlight: #F5A623;
    --primary: #6C5CE0;
    --primary-dark: #5642C4;
    --primary-light: #B7ADEB;
    --success: #2FA360;
    --success-bg: #E3F7EA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Gothic A1', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 18px 12px 92px;
  }

  .page {
    width: 100%;
    max-width: 460px;
  }

  .app-header { margin-bottom: 14px; }
  .app-header .eyebrow {
    display: block;
    font-size: 0.72rem;
    color: var(--pencil);
    margin-bottom: 2px;
  }
  .app-header h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: -0.01em;
  }

  .fallback-note {
    font-size: 0.75rem;
    background: rgba(232,83,107,0.1);
    color: var(--pen-red-dark);
    border: 1px solid rgba(232,83,107,0.25);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 12px;
  }
  .fallback-note.info {
    background: rgba(74,144,217,0.1);
    color: var(--pen-blue-dark);
    border-color: rgba(74,144,217,0.25);
  }

  .msg {
    font-size: 0.8rem;
    border-radius: 10px;
    padding: 8px 12px;
    margin: 10px 0;
  }
  .msg.ok { background: var(--success-bg); color: var(--success); }
  .msg.err { background: rgba(232,83,107,0.1); color: var(--pen-red-dark); }

  .panel { display: none; }
  .panel.active { display: block; }
  .panel-card {
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 4px 18px rgba(108,92,224,0.08);
  }

  /* ---------- home: hero card ---------- */
  .hero-card {
    background: linear-gradient(135deg, #ECE8FB 0%, #F6F4FC 100%);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .hero-title {
    font-size: 1.1rem;
    line-height: 1.45;
    margin: 0 0 10px;
    font-weight: 700;
    color: var(--ink);
    max-width: 76%;
  }
  .hero-accent { color: var(--primary); }
  .hero-pill {
    display: inline-block;
    background: rgba(255,255,255,0.78);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 0.72rem;
    color: var(--pencil);
  }
  .hero-icon { position: absolute; right: 12px; bottom: 12px; opacity: 0.95; }

  /* ---------- home: quick action cards ---------- */
  .quick-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .quick-card {
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 16px;
    padding: 16px 12px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 3px;
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(108,92,224,0.06);
    font-family: 'Gothic A1', sans-serif;
  }
  .quick-card:active { transform: scale(0.97); }
  .quick-card:disabled { opacity: 0.4; cursor: default; }
  .quick-icon {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    color: #fff;
    margin-bottom: 4px;
  }
  .quick-icon.purple { background: var(--primary); }
  .quick-icon.blue { background: var(--pen-blue); }
  .quick-icon.lightpurple { background: var(--primary-light); }
  .quick-title { font-weight: 700; font-size: 0.88rem; color: var(--ink); }
  .quick-sub { font-size: 0.68rem; color: var(--pencil); margin-bottom: 8px; }
  .quick-pill {
    width: 100%;
    padding: 8px;
    border-radius: 10px;
    font-size: 0.78rem;
    font-weight: 700;
  }
  .quick-pill.purple { background: var(--primary); color: #fff; }
  .quick-pill.blue { background: var(--pen-blue); color: #fff; }
  .quick-pill.lightpurple { background: #EDE9FB; color: var(--primary-dark); }

  /* ---------- home: summary + mini chart ---------- */
  .summary-card { margin-bottom: 4px; }
  .summary-title { font-weight: 700; font-size: 0.92rem; margin-bottom: 12px; }

  .idbox-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .idbox {
    flex: 1;
    background: var(--paper-light);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    text-align: center;
    padding: 8px 4px;
  }
  .idbox .lbl { display: block; font-size: 0.64rem; color: var(--pencil); margin-bottom: 3px; }
  .idbox .val {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink);
  }

  .mini-chart-label { font-size: 0.7rem; color: var(--pencil); margin: 0 0 6px; }
  .mini-chart {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 56px;
    margin: 0 0 2px;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--paper-line);
  }
  .mini-bar {
    flex: 1;
    background: linear-gradient(180deg, var(--primary), var(--primary-light));
    border-radius: 4px 4px 0 0;
    min-height: 3px;
  }

  /* ---------- forms ---------- */
  .entry {
    width: 100%;
    min-height: 66px;
    padding: 12px 14px;
    border: 1px solid var(--paper-line);
    border-radius: 12px;
    background: var(--paper-light);
    font-family: 'Gothic A1', sans-serif;
    font-size: 0.92rem;
    color: var(--ink);
    resize: vertical;
  }
  .entry:focus { outline: 2px solid var(--primary); outline-offset: 1px; }

  .example { font-size: 0.76rem; color: var(--pencil); margin: 8px 0 12px; }

  .btn {
    font-family: 'Gothic A1', sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    border: none;
    border-radius: 12px;
    padding: 13px 16px;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: #fff; width: 100%; }
  .btn-secondary { background: #EDE9FB; color: var(--primary-dark); width: 100%; }
  .btn-accent { background: var(--highlight); color: var(--ink); width: 100%; font-size: 1rem; padding: 15px; }
  .btn-ghost {
    background: none;
    color: var(--pencil);
    font-size: 0.78rem;
    padding: 4px 6px;
    text-decoration: underline;
    border: none;
    cursor: pointer;
  }
  .btn-ghost.danger { color: var(--pen-red); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .list-trigger-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
    font-size: 0.85rem;
  }
  .list-trigger-row .count { font-weight: 700; }

  /* ---------- list modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(46,43,69,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal-box {
    background: var(--paper);
    width: 100%;
    max-width: 460px;
    max-height: 85vh;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(46,43,69,0.35);
  }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid var(--paper-line);
    font-weight: 700;
    font-size: 0.95rem;
    flex-shrink: 0;
  }
  .modal-close { background: none; border: none; font-size: 1.2rem; color: var(--pencil); cursor: pointer; padding: 0 4px; }
  .modal-body { overflow-y: auto; padding: 4px 18px; flex: 1; }
  .modal-foot { padding: 12px 18px; border-top: 1px solid var(--paper-line); text-align: right; flex-shrink: 0; }

  .list-header-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 2px;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--pencil);
    border-bottom: 1px solid var(--paper-line);
    position: sticky;
    top: 0;
    background: var(--paper);
  }
  .list-header-row .lh-num { width: 22px; flex-shrink: 0; }
  .list-header-row .lh-txt { flex: 1; }
  .list-header-row .lh-star,
  .list-header-row .lh-badge { width: 22px; flex-shrink: 0; text-align: center; }

  .row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 2px;
    border-bottom: 1px solid var(--paper-line);
  }
  .row .num {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.72rem;
    color: var(--pencil);
    width: 22px;
    padding-top: 2px;
    flex-shrink: 0;
  }
  .row .txt { flex: 1; font-size: 0.88rem; line-height: 1.4; }
  .row .star {
    flex-shrink: 0;
    width: 22px;
    background: none; border: none;
    font-size: 1rem; cursor: pointer; color: var(--highlight);
    padding: 0;
  }
  .badge {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.72rem;
    font-family: ui-monospace, monospace;
  }
  .badge.O { color: var(--success); border: 2px solid var(--success); }
  .badge.X { color: var(--pen-red); border: 2px solid var(--pen-red); }

  .empty { color: var(--pencil); font-size: 0.85rem; padding: 20px 6px; text-align: center; }

  /* ---------- favorites-only toggle ---------- */
  .fav-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    margin-bottom: 14px;
    color: var(--pencil);
  }
  .fav-toggle input { accent-color: var(--primary); width: 16px; height: 16px; }

  .quiz-idle-info { font-size: 0.88rem; margin-bottom: 4px; }
  .quiz-idle-note { font-size: 0.76rem; color: var(--pencil); margin-bottom: 14px; }

  /* ---------- dedicated quiz screen ---------- */
  .qs-exit-row { margin-bottom: 10px; }
  .qs-exit {
    background: none;
    border: none;
    color: var(--pencil);
    font-size: 0.82rem;
    font-family: 'Gothic A1', sans-serif;
    cursor: pointer;
    padding: 2px 0;
  }

  .qs-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: var(--pencil);
    margin-bottom: 6px;
  }
  .qs-meta .cum { color: var(--primary); font-weight: 700; }

  .progress-bar {
    height: 6px;
    background: var(--paper-line);
    border-radius: 3px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .progress-bar > div {
    height: 100%;
    background: linear-gradient(90deg, var(--pen-blue), var(--primary));
    width: 0%;
    transition: width 0.25s ease;
  }

  .qs-qrow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .qs-qnum {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 700;
    font-size: 1rem;
    color: var(--primary);
  }
  .qs-fav {
    background: none; border: none;
    font-size: 1.35rem;
    color: var(--highlight);
    cursor: pointer;
    line-height: 1;
    padding: 0;
  }

  .timer-block { margin: 4px 0 16px; }
  .timer-digital {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--ink);
  }
  .timer-bar {
    height: 7px;
    background: var(--paper-line);
    border-radius: 4px;
    margin-top: 6px;
    overflow: hidden;
  }
  .timer-bar-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--pen-blue), var(--primary));
    border-radius: 4px;
    transition: width 0.12s linear, background 0.3s ease;
  }
  .timer-bar-fill.urgent { background: linear-gradient(90deg, var(--highlight), var(--pen-red)); }

  .statement {
    background: var(--paper-light);
    border: 1px solid var(--paper-line);
    border-radius: 14px;
    padding: 22px 16px;
    min-height: 96px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.06rem;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .choice-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .choice-row.big { gap: 12px; margin-top: 6px; }
  .choice-card {
    flex: 1;
    min-height: 110px;
    border-radius: 16px;
    background: var(--paper-light);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .choice-card.o { border: 2px solid var(--pen-blue); color: var(--pen-blue); background: rgba(74,144,217,0.07); }
  .choice-card.x { border: 2px solid var(--primary); color: var(--primary); background: rgba(108,92,224,0.07); }
  .choice-card:active { transform: scale(0.97); }
  .choice-card:disabled { opacity: 0.5; cursor: default; }
  .choice-card .mark { font-size: 2.4rem; line-height: 1; }

  .hint { font-size: 0.72rem; color: var(--pencil); text-align: center; margin-bottom: 6px; }

  .feedback {
    text-align: center;
    font-size: 0.9rem;
    font-weight: 700;
    border-radius: 12px;
    padding: 11px;
    margin-bottom: 10px;
    min-height: 20px;
  }
  .feedback.correct { background: var(--success-bg); color: var(--success); }
  .feedback.wrong { background: rgba(232,83,107,0.1); color: var(--pen-red-dark); }

  /* ---------- result screen ---------- */
  .result-score {
    text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 2.3rem;
    font-weight: 700;
    color: var(--primary);
    margin: 6px 0 2px;
  }
  .result-pct { text-align: center; color: var(--pencil); margin-bottom: 6px; }
  .result-note { text-align: center; font-size: 0.9rem; margin-bottom: 16px; }

  .wrong-review {
    margin: 4px 0 16px;
    border: 1px solid var(--paper-line);
    border-radius: 12px;
    overflow: hidden;
  }
  .wrong-review-head {
    background: rgba(232,83,107,0.08);
    color: var(--pen-red-dark);
    font-weight: 700;
    font-size: 0.8rem;
    padding: 9px 12px;
  }
  .wrong-review-list { max-height: 180px; overflow-y: auto; }
  .wrong-review-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 8px 12px;
    border-top: 1px solid var(--paper-line);
    font-size: 0.82rem;
  }
  .wr-num { color: var(--pencil); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; flex-shrink: 0; }
  .wr-txt { flex: 1; line-height: 1.4; }

  .result-btns { display: flex; gap: 10px; }

  /* ---------- history ---------- */
  .hist-summary { display: flex; gap: 8px; margin-bottom: 14px; }
  .hist-list { max-height: 340px; overflow-y: auto; }
  .hist-row { border-bottom: 1px solid var(--paper-line); padding: 10px 2px; }
  .hist-row .top { display: flex; justify-content: space-between; font-size: 0.85rem; }
  .hist-row .date { color: var(--pencil); }
  .hist-row .score { font-weight: 700; font-family: ui-monospace, monospace; }
  .hist-row .bar { height: 5px; background: var(--paper-line); border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .hist-row .bar > div { height: 100%; background: linear-gradient(90deg, var(--pen-blue), var(--primary)); }
  .hist-footer { text-align: right; margin-top: 14px; }

  .loading { color: var(--pencil); text-align: center; padding: 60px 0; font-family: 'Gothic A1', sans-serif; }

  /* ---------- bottom nav ---------- */
  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--paper);
    border-top: 1px solid var(--paper-line);
    display: flex;
    justify-content: space-around;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -4px 18px rgba(46,43,69,0.1);
    z-index: 40;
  }
  .nav-item {
    flex: 1;
    max-width: 110px;
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 4px;
    color: var(--pencil);
    font-family: 'Gothic A1', sans-serif;
    cursor: pointer;
    border-radius: 12px;
  }
  .nav-item.active { color: var(--primary); font-weight: 700; background: rgba(108,92,224,0.09); }
  .nav-icon { font-size: 1.15rem; line-height: 1; }
  .nav-label { font-size: 0.66rem; }

  @media (min-width: 600px) {
    .page { max-width: 480px; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="loading">불러오는 중...</div>
</div>

<script>
(function () {
  "use strict";

  // ---------- storage helpers ----------
  // 1순위: Claude 아티팩트 저장소 / 2순위: 이 파일을 다른 사이트에 올렸을 때를 위한 브라우저 localStorage / 3순위: 메모리(새로고침하면 사라짐)
  var hasStorage = (typeof window.storage !== 'undefined' && window.storage !== null);
  var STORAGE_PREFIX = 'ox_quiz_';

  function checkLocalStorage() {
    try {
      var k = '__ox_quiz_test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }
  var hasLocalStorage = !hasStorage && checkLocalStorage();
  var storageMode = hasStorage ? 'claude' : (hasLocalStorage ? 'local' : 'memory');
  var memFallback = {};

  async function safeGet(key) {
    if (hasStorage) {
      try {
        var r = await window.storage.get(key, false);
        return r ? r.value : null;
      } catch (e) {
        return null;
      }
    }
    if (hasLocalStorage) {
      try {
        return window.localStorage.getItem(STORAGE_PREFIX + key);
      } catch (e) {
        return null;
      }
    }
    return (key in memFallback) ? memFallback[key] : null;
  }

  async function safeSet(key, value) {
    if (hasStorage) {
      try {
        await window.storage.set(key, value, false);
        return true;
      } catch (e) {
        return false;
      }
    }
    if (hasLocalStorage) {
      try {
        window.localStorage.setItem(STORAGE_PREFIX + key, value);
        return true;
      } catch (e) {
        return false;
      }
    }
    memFallback[key] = value;
    return true;
  }

  // ---------- state ----------
  var state = {
    sentences: [],
    history: [],
    tab: 'home',
    showListModal: false,
    filterFavorites: false,
    quiz: {
      phase: 'idle', // idle | active | result
      set: [],
      index: 0,
      correct: 0,
      answered: false,
      tickHandle: null,
      startedAt: 0,
      wrongList: []
    }
  };

  var TIME_LIMIT_MS = 10000;
  var SET_SIZE = 30;

  // 시연이 전달해준 생명과학I OX 기출 문제 100제 (처음 실행 시 자동으로 채워져요)

  function uid() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatKR(isoString) {
    var d = new Date(isoString);
    return d.getFullYear() + '년 ' + pad(d.getMonth() + 1) + '월 ' + pad(d.getDate()) + '일 ' +
      pad(d.getHours()) + '시 ' + pad(d.getMinutes()) + '분';
  }

  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------- persistence ----------
  async function loadAll() {
    var s = await safeGet('sentences');
    var h = await safeGet('history');

    if (s === null) {
      // 처음 실행: 저장된 값이 전혀 없을 때만 기본 100문제로 채워준다
      var now = new Date().toISOString();
      state.sentences = DEFAULT_SEED.map(function (item) {
        return { id: uid(), text: item.text, answer: item.answer, createdAt: now, favorite: false };
      });
      await persistSentences();
    } else {
      try { state.sentences = JSON.parse(s); } catch (e) { state.sentences = []; }
    }

    try { state.history = h ? JSON.parse(h) : []; } catch (e) { state.history = []; }
  }

  async function persistSentences() {
    var ok = await safeSet('sentences', JSON.stringify(state.sentences));
    if (!ok) toast('문제 저장에 실패했어요. 네트워크를 확인해주세요.', true);
  }

  async function persistHistory() {
    var ok = await safeSet('history', JSON.stringify(state.history));
    if (!ok) toast('기록 저장에 실패했어요. 네트워크를 확인해주세요.', true);
  }

  // ---------- toast ----------
  var toastTimer = null;
  function toast(msg, isErr) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'msg ' + (isErr ? 'err' : 'ok');
    el.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.style.display = 'none'; }, 3200);
  }

  function parseInput(raw) {
    var lines = raw.split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
    var ok = [], fail = [];
    var re = /^(.+)\/\s*([oOxX])\s*$/;
    lines.forEach(function (line) {
      var m = line.match(re);
      if (m && m[1].trim().length > 0) {
        ok.push({ text: m[1].trim(), answer: m[2].toUpperCase() });
      } else {
        fail.push(line);
      }
    });
    return { ok: ok, fail: fail };
  }

  // 전체 기록(과거 시도 + 현재 진행 중인 세트)을 합산한 누적 정답률
  function cumulativeAccuracy() {
    var totalCorrect = 0, totalCount = 0;
    state.history.forEach(function (r) { totalCorrect += r.score; totalCount += r.total; });
    if (state.quiz.phase === 'active') {
      totalCorrect += state.quiz.correct;
      totalCount += state.quiz.index;
    }
    if (totalCount === 0) return null;
    return Math.round(totalCorrect / totalCount * 100);
  }

  function toggleFavoriteById(id) {
    var found = state.sentences.find(function (s) { return s.id === id; });
    var newVal;
    if (found) {
      found.favorite = !found.favorite;
      newVal = found.favorite;
      persistSentences();
    }
    var inSet = state.quiz.set.find(function (s) { return s.id === id; });
    if (inSet) inSet.favorite = (newVal !== undefined) ? newVal : !inSet.favorite;
  }

  // ---------- QUIZ panel (대기 화면 / 결과 화면) ----------
  function renderQuiz() {
    var q = state.quiz;
    var total = state.sentences.length;
    var favCount = state.sentences.filter(function (s) { return s.favorite; }).length;

    if (q.phase === 'idle') {
      if (total === 0) {
        return '<div class="empty">문제를 먼저 추가해주세요.<br>‘문제 추가’ 탭에서 문장을 등록할 수 있어요.</div>';
      }
      var pool = state.filterFavorites ? favCount : total;
      var setSize = Math.min(SET_SIZE, pool);
      return (
        (favCount > 0 ?
          '<label class="fav-toggle"><input type="checkbox" id="favOnlyChk" ' + (state.filterFavorites ? 'checked' : '') + '> ⭐ 즐겨찾기한 문제만 풀기 (' + favCount + '개)</label>'
          : '') +
        (pool === 0
          ? '<div class="empty">즐겨찾기한 문제가 없어요.<br>목록에서 별표를 눌러 즐겨찾기를 추가해보세요.</div>'
          : (
            '<p class="quiz-idle-info">이번 세트는 총 <strong>' + setSize + '문제</strong>예요.</p>' +
            '<p class="quiz-idle-note">' + (pool >= SET_SIZE
              ? '풀이 가능한 문제가 30개 이상이라, 시작할 때마다 무작위로 30문제를 뽑아요.'
              : '아직 30개 미만이라 풀이 가능한 문제를 모두 풀어요. 30개가 모이면 매 세트 30문제씩 진행돼요.') + '</p>' +
            '<button id="startBtn" class="btn btn-accent">퀴즈 시작</button>'
          ))
      );
    }

    // result
    var pct = Math.round((q.correct / q.set.length) * 100);
    var note;
    if (pct >= 90) note = '완벽해요! 이 페이스 그대로 유지해봐요.';
    else if (pct >= 70) note = '좋아요, 조금만 더 다지면 만점이에요.';
    else if (pct >= 50) note = '기초는 잡혔어요. 틀린 문제 위주로 반복해봐요.';
    else note = '천천히 다시 훑어봐요. 처음이 제일 어려운 법이에요.';

    return (
      '<div class="result-score">' + q.correct + ' / ' + q.set.length + '</div>' +
      '<div class="result-pct">정답률 ' + pct + '%</div>' +
      '<div class="result-note">' + note + '</div>' +
      (q.wrongList.length > 0
        ? '<div class="wrong-review">' +
            '<div class="wrong-review-head">틀린 문제 (' + q.wrongList.length + ')</div>' +
            '<div class="wrong-review-list">' + q.wrongList.map(function (w, i) {
              return '<div class="wrong-review-row">' +
                '<span class="wr-num">' + (i + 1) + '</span>' +
                '<span class="wr-txt">' + escapeHTML(w.text) + '</span>' +
                '<span class="badge ' + w.answer + '">' + w.answer + '</span>' +
              '</div>';
            }).join('') + '</div>' +
          '</div>' +
          '<button id="retryWrongBtn" class="btn btn-primary" style="margin-bottom:10px;">틀린 문제만 다시 풀기 (' + q.wrongList.length + ')</button>'
        : '') +
      '<div class="result-btns">' +
        '<button id="retryBtn" class="btn btn-secondary">다시 풀기</button>' +
        '<button id="toHistBtn" class="btn btn-secondary" style="background:var(--pen-blue); color:#fff;">기록 보기</button>' +
      '</div>'
    );
  }

  // ---------- 퀴즈 전용 화면 (문제 풀이 중) ----------
  function renderQuizScreen() {
    var q = state.quiz;
    var current = q.set[q.index];
    var progressPct = Math.round((q.index / q.set.length) * 100);
    var cum = cumulativeAccuracy();

    return (
      '<div class="qs-exit-row"><button id="qsExitBtn" class="qs-exit">← 나가기</button></div>' +
      '<div class="qs-meta">' +
        '<span>문제 ' + (q.index + 1) + ' / ' + q.set.length + '</span>' +
        '<span class="cum">정답률 ' + (cum === null ? '-' : cum + '%') + '</span>' +
      '</div>' +
      '<div class="progress-bar"><div style="width:' + progressPct + '%"></div></div>' +
      '<div class="qs-qrow">' +
        '<span class="qs-qnum">Q. ' + pad(q.index + 1) + '</span>' +
        '<button id="qsFavBtn" class="qs-fav" aria-label="즐겨찾기">' + (current.favorite ? '★' : '☆') + '</button>' +
      '</div>' +

        '<span class="timer-digital">⏱ 00:<span id="timerNum">10</span></span>' +
        '<div class="timer-bar"><div id="timerBarFill" class="timer-bar-fill"></div></div>' +
      '</div>' +
      '<div class="statement">' + escapeHTML(current.text) + '</div>' +
      '<div id="feedbackBox"></div>' +
      '<div class="choice-row big">' +
        '<button id="btnO" class="choice-card o"><span class="mark">◯</span></button>' +
        '<button id="btnX" class="choice-card x"><span class="mark">✕</span></button>' +
      '</div>' +
      '<p class="hint">키보드 ← / O 키, → / X 키로도 답할 수 있어요</p>'

  // ---------- HISTORY panel ----------
  function renderHistory() {
    if (state.history.length === 0) {
      return '<div class="empty">아직 퀴즈 기록이 없어요.<br>‘OX 퀴즈’ 탭에서 첫 세트를 풀어보세요.</div>';
    }
    var records = state.history.slice().reverse();
    var best = Math.max.apply(null, state.history.map(function (r) { return Math.round(r.score / r.total * 100); }));
    var avg = Math.round(state.history.reduce(function (sum, r) { return sum + (r.score / r.total * 100); }, 0) / state.history.length);

    var recent = state.history.slice(-12);
    var chartHtml = '<div class="mini-chart">' + recent.map(function (r) {
      var p = Math.round(r.score / r.total * 100);
      return '<div class="mini-bar" style="height:' + Math.max(p, 4) + '%" title="' + p + '%"></div>';
    }).join('') + '</div>' +
    '<div class="mini-chart-label">최근 ' + recent.length + '회 정답률 추이</div>';

    var listHtml = '<div class="hist-list">' + records.map(function (r) {
      var p = Math.round(r.score / r.total * 100);
      return '<div class="hist-row">' +
        '<div class="top"><span class="date">' + formatKR(r.timestamp) + '</span><span class="score">' + r.score + '/' + r.total + ' (' + p + '%)</span></div>' +
        '<div class="bar"><div style="width:' + p + '%"></div></div>' +
      '</div>';
    }).join('') + '</div>';

    return (
      '<div class="hist-summary">' +
        idbox('총 응시', state.history.length + '회') +
        idbox('평균 점수', avg + '%') +
        idbox('최고 점수', best + '%') +
      '</div>' +
      chartHtml +
      listHtml +
      '<div class="hist-footer"><button id="resetAllBtn" class="btn-ghost danger">모든 데이터 초기화</button></div>'
    );
  }

  // ---------- event wiring: 일반 화면(탭 + 목록 모달) ----------
  function attachMainHandlers() {
    document.querySelectorAll('[data-tab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.tab = btn.getAttribute('data-tab');
        render();
      });
    });

    var homeStartBtn = document.getElementById('homeStartBtn');
    if (homeStartBtn) homeStartBtn.addEventListener('click', function () {
      state.filterFavorites = false;
      startQuiz();
    });

    var homeFavBtn = document.getElementById('homeFavBtn');
    if (homeFavBtn) homeFavBtn.addEventListener('click', function () {
      state.filterFavorites = true;
      startQuiz();
    });

    var homeListBtn = document.getElementById('homeListBtn');
    if (homeListBtn) homeListBtn.addEventListener('click', function () {
      state.showListModal = true;
      render();
    });

    var homeAddBtn = document.getElementById('homeAddBtn');
    if (homeAddBtn) homeAddBtn.addEventListener('click', function () {
      state.tab = 'add';
      render();
      var input = document.getElementById('entryInput');
      if (input) input.focus();
    });

    var addBtn = document.getElementById('addBtn');
    if (addBtn) addBtn.addEventListener('click', handleAdd);

    var openListBtn = document.getElementById('openListBtn');
    if (openListBtn) openListBtn.addEventListener('click', function () {
      state.showListModal = true;
      render();
    });

    var closeListBtn = document.getElementById('closeListBtn');
    if (closeListBtn) closeListBtn.addEventListener('click', function () {
      state.showListModal = false;
      render();
    });

    var listModalOverlay = document.getElementById('listModalOverlay');
    if (listModalOverlay) listModalOverlay.addEventListener('click', function (e) {
      if (e.target === listModalOverlay) { state.showListModal = false; render(); }
    });

    document.querySelectorAll('[data-star]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        toggleFavoriteById(btn.getAttribute('data-star'));
        render();
      });
    });

    var clearAllBtn = document.getElementById('clearAllBtn');
    if (clearAllBtn) attachTwoStepConfirm(clearAllBtn, '정말 전체 삭제할까요?', function () {
      state.sentences = [];
      persistSentences();
      state.showListModal = false;
      render();
    });

    var resetAllBtn = document.getElementById('resetAllBtn');
    if (resetAllBtn) attachTwoStepConfirm(resetAllBtn, '정말 모든 데이터를 초기화할까요?', function () {
      state.sentences = [];
      state.history = [];
      persistSentences();
      persistHistory();
      render();
    });

    var favOnlyChk = document.getElementById('favOnlyChk');
    if (favOnlyChk) favOnlyChk.addEventListener('change', function () {
      state.filterFavorites = favOnlyChk.checked;
      render();
    });

    var startBtn = document.getElementById('startBtn');
    if (startBtn) startBtn.addEventListener('click', function () { startQuiz(); });

    var retryBtn = document.getElementById('retryBtn');
    if (retryBtn) retryBtn.addEventListener('click', function () { startQuiz(); });

    var retryWrongBtn = document.getElementById('retryWrongBtn');
    if (retryWrongBtn) retryWrongBtn.addEventListener('click', function () {
      startQuiz(state.quiz.wrongList.slice());
    });

    var toHistBtn = document.getElementById('toHistBtn');
    if (toHistBtn) toHistBtn.addEventListener('click', function () {
      state.quiz.phase = 'idle';
      state.tab = 'history';
      render();
    });
  }

  // ---------- event wiring: 퀴즈 전용 화면 ----------
  function attachQuizScreenHandlers() {
    var btnO = document.getElementById('btnO');
    var btnX = document.getElementById('btnX');
    if (btnO) btnO.addEventListener('click', function () { answerQuiz('O'); });
    if (btnX) btnX.addEventListener('click', function () { answerQuiz('X'); });

    var qsFavBtn = document.getElementById('qsFavBtn');
    if (qsFavBtn) qsFavBtn.addEventListener('click', function () {
      toggleFavoriteById(state.quiz.set[state.quiz.index].id);
      qsFavBtn.textContent = state.quiz.set[state.quiz.index].favorite ? '★' : '☆';
    });

    var qsExitBtn = document.getElementById('qsExitBtn');
    if (qsExitBtn) attachTwoStepConfirm(qsExitBtn, '정말 그만둘까요?', function () {
      stopTick();
      state.quiz.phase = 'idle';
      render();
    });
  }

  function attachTwoStepConfirm(btn, confirmLabel, onConfirm) {
    var originalLabel = btn.textContent;
    var armed = false;
    var revertTimer = null;
    btn.addEventListener('click', function () {
      if (!armed) {
        armed = true;
        btn.textContent = confirmLabel + ' (다시 클릭)';
        revertTimer = setTimeout(function () {
          armed = false;
          btn.textContent = originalLabel;
        }, 4000);
      } else {
        clearTimeout(revertTimer);
        onConfirm();
      }
    });
  }

  // ---------- ADD logic ----------
  function handleAdd() {
    var input = document.getElementById('entryInput');
    var raw = input.value;
    var parsed = parseInput(raw);

    if (parsed.ok.length === 0 && parsed.fail.length === 0) {
      return;
    }

    var msgHtml = '';
    var addedCount = parsed.ok.length;

    if (addedCount > 0) {
      var now = new Date().toISOString();
      parsed.ok.forEach(function (item) {
        state.sentences.push({ id: uid(), text: item.text, answer: item.answer, createdAt: now, favorite: false });
      });
      persistSentences();
      msgHtml += '<div class="msg ok">' + addedCount + '개 문제를 추가했어요.</div>';
    }
    if (parsed.fail.length > 0) {
      msgHtml += '<div class="msg err">형식이 맞지 않아 추가하지 못한 줄 ' + parsed.fail.length + '개가 있어요. ' +
        (addedCount > 0 ? '남겨둔 문장을 확인하고 다시 추가해주세요.' : '문장 끝에 /o 또는 /x 를 붙였는지 확인해주세요.') + '</div>';
    }

    if (addedCount > 0) {
      // sentence list changed -> full re-render, then restore any failed lines for the user to fix
      render();
      var input2 = document.getElementById('entryInput');
      if (input2 && parsed.fail.length > 0) input2.value = parsed.fail.join('\n');
      var newMsgEl = document.getElementById('addMsg');
      if (newMsgEl) newMsgEl.innerHTML = msgHtml;
    } else {
      // nothing added -> keep textarea text as-is so the user can fix it, no need to rebuild the DOM
      var msgEl = document.getElementById('addMsg');
      if (msgEl) msgEl.innerHTML = msgHtml;
    }
  }

  // ---------- QUIZ logic ----------
  // customSet이 주어지면 (오답 다시 풀기) 그 문제들로, 아니면 즐겨찾기 필터를 반영한 전체 풀에서 세트를 구성한다
  function startQuiz(customSet) {
    var pool;
    if (customSet && customSet.length > 0) {
      pool = customSet;
    } else if (state.filterFavorites) {
      pool = state.sentences.filter(function (s) { return s.favorite; });
    } else {
      pool = state.sentences;
    }
    if (pool.length === 0) return;
    var setSize = Math.min(SET_SIZE, pool.length);
    state.quiz = {
      phase: 'active',
      set: shuffle(pool).slice(0, setSize),
      index: 0,
      correct: 0,
      answered: false,
      tickHandle: null,
      startedAt: Date.now(),
      wrongList: []
    };
    state.tab = 'quiz';
    render();
  }

  function startTick() {
    stopTick();
    state.quiz.startedAt = Date.now();
    state.quiz.answered = false;
    var numEl = document.getElementById('timerNum');
    var fillEl = document.getElementById('timerBarFill');

    state.quiz.tickHandle = setInterval(function () {
      var elapsed = Date.now() - state.quiz.startedAt;
      var remaining = Math.max(0, TIME_LIMIT_MS - elapsed);
      var secs = Math.ceil(remaining / 1000);

      if (numEl) numEl.textContent = pad(secs);
      if (fillEl) {
        fillEl.style.width = (remaining / TIME_LIMIT_MS * 100) + '%';
        if (remaining <= 3000) fillEl.classList.add('urgent');
        else fillEl.classList.remove('urgent');
      }

      if (remaining <= 0) {
        answerQuiz(null);
      }
    }, 100);
  }

  function stopTick() {
    if (state.quiz.tickHandle) {
      clearInterval(state.quiz.tickHandle);
      state.quiz.tickHandle = null;
    }
  }

  function answerQuiz(choice) {
    var q = state.quiz;
    if (q.phase !== 'active' || q.answered) return;
    q.answered = true;
    stopTick();

    var current = q.set[q.index];
    var correct = (choice === current.answer);
    if (correct) {
      q.correct++;
    } else {
      q.wrongList.push({ id: current.id, text: current.text, answer: current.answer });
    }

    var btnO = document.getElementById('btnO');
    var btnX = document.getElementById('btnX');
    if (btnO) btnO.disabled = true;
    if (btnX) btnX.disabled = true;

    var fbEl = document.getElementById('feedbackBox');
    if (fbEl) {
      var label;
      if (choice === null) label = '⏱ 시간 초과! 정답은 ' + current.answer + ' 였어요.';
      else if (correct) label = '✓ 정답이에요!';
      else label = '✕ 오답이에요. 정답은 ' + current.answer + ' 였어요.';
      fbEl.innerHTML = '<div class="feedback ' + (correct ? 'correct' : 'wrong') + '">' + label + '</div>';
    }

    setTimeout(function () {
      q.index++;
      if (q.index < q.set.length) {
        q.answered = false;
        render();
      } else {
        finishQuiz();
      }
    }, 900);
  }

  function finishQuiz() {
    var q = state.quiz;
    stopTick();
    var record = {
      timestamp: new Date().toISOString(),
      score: q.correct,
      total: q.set.length
    };
    state.history.push(record);
    persistHistory();
    q.phase = 'result';
    render();
  }

  // keyboard support during active quiz
  document.addEventListener('keydown', function (e) {
    if (state.quiz.phase !== 'active' || state.quiz.answered) return;
    var k = e.key.toLowerCase();
    if (k === 'o' || k === 'arrowleft') answerQuiz('O');
    else if (k === 'x' || k === 'arrowright') answerQuiz('X');
  });

  // ---------- init ----------
  loadAll().then(render);
})();
</script>
